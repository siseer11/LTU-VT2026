<!doctype html>
<html lang="sv-SE">
  <head>
    <meta charset="UTF-8" />
    <title>SmartParking</title>
    <meta name="title" content="SmartParking" />
    <meta name="description" content="Enkel parkering med vår allt-i-ett-app" />
    <link rel="stylesheet" href="övning3.css" />
  </head>
  <body>
    <div id="header-section">
      <div class="logo">SmartParking Live</div>
      <nav class="menu-links">
        <a href="#karta">Karta</a><a href="#info">Info</a>
      </nav>
    </div>

    <main id="content-area">
      <section class="garage-container">
        <h4>Live-vy: Garageplan A</h4>
        <p>Klicka på en ruta för att se detaljer.</p>

        <div class="floor-layout">
          <button aria-label="Parkeringsruta 1: Upptagen" class="spot">
            <span aria-hidden="true">🚗</span>
          </button>
          <button aria-label="Parkeringsruta 2: Upptagen" class="spot">
            <span aria-hidden="true">🚗</span>
          </button>
          <button aria-label="Parkeringsruta 3: Ledig" class="spot"></button>
          <button aria-label="Parkeringsruta 4: Upptagen" class="spot">
            <span aria-hidden="true">🚗</span>
          </button>
        </div>
      </section>

      <section class="info-sidebar">
        <h5>Priser och Regler</h5>
        <p>Standardtaxa: 20kr/h. Orangea streckade linjer visar zongränsen.</p>
      </section>
    </main>

    <footer>
      <p>© 2026 SmartParking AB</p>
    </footer>
  </body>
</html>
